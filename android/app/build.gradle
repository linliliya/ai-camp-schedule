plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def signingFile = rootProject.file('signing.properties')
def signingProps = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace 'cn.aurange.schedule'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.aurange.schedule'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '1.10.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        personal {
            if (signingFile.exists()) {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.personal
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
    bundle { language { enableSplit = false } }
    testOptions { unitTests.all {
        dependsOn 'generateWebParityFixture'
        systemProperty 'schedule.assets', file('src/main/assets').absolutePath
        systemProperty 'schedule.webFixture', layout.buildDirectory.file('generated/tests/web-model.json').get().asFile.absolutePath
    } }
    packaging { resources.excludes += '/META-INF/{AL2.0,LGPL2.1}' }
}

tasks.register('generateWebParityFixture', Exec) {
    workingDir rootProject.projectDir.parentFile
    def target = layout.buildDirectory.file('generated/tests/web-model.json').get().asFile
    inputs.files(rootProject.file('../data.js'), rootProject.file('../index.html'), rootProject.file('../scripts/export-android-fixtures.js'))
    outputs.file target
    commandLine 'node', 'scripts/export-android-fixtures.js', target.absolutePath
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'dev.chrisbanes.haze:haze:1.1.1'
    implementation('com.kizitonwose.calendar:compose:2.6.1') {
        exclude group: 'androidx.compose.ui', module: 'ui-tooling'
    }
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
